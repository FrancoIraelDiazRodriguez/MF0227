<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head><title>Iparhotel · Iniciar sesión</title></head>
<body>
<main>
    <h1>Iniciar sesión</h1>
    <p class="aviso error" th:if="${param.error}">Email o contraseña incorrectos.</p>
    <p class="aviso ok" th:if="${param.salir}">Has cerrado la sesión.</p>
    <form class="formulario" th:action="@{/login}" method="post">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus>
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>
        <button type="submit" class="boton">Entrar</button>
    </form>
</main>
</body>
</html>
