<!DOCTYPE html>
<!-- Plantilla comun: cada pagina le pasa su titulo y su <main> -->
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(titulo, contenido)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${titulo}">Iparhotel</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header class="cabecera">
    <a class="marca" th:href="@{/}">Iparhotel</a>
    <nav>
        <a th:href="@{/}">Habitaciones</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/reservas}">Mis reservas</a>
        <a sec:authorize="hasRole('ADMINISTRADOR')" th:href="@{/admin}">Administración</a>
        <a sec:authorize="isAnonymous()" th:href="@{/login}">Iniciar sesión</a>
        <span sec:authorize="isAuthenticated()" class="usuario">
            <span sec:authentication="name">usuario</span>
            <form th:action="@{/logout}" method="post" class="en-linea">
                <button type="submit" class="enlace">Cerrar sesión</button>
            </form>
        </span>
    </nav>
</header>

<div class="contenedor">
    <p class="aviso ok" th:if="${mensaje}" th:text="${mensaje}">Mensaje</p>
    <p class="aviso error" th:if="${error}" th:text="${error}">Error</p>
    <main th:replace="${contenido}">Contenido</main>
</div>

<footer class="pie">Iparhotel · Hotel rural · Reservas online</footer>
</body>
</html>
