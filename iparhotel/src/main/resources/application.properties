spring.application.name=iparhotel
server.port=8080

# ---------------------------------------------------------------
# Base de datos MySQL (se crea sola la primera vez)
# La contrasena se puede pasar con la variable de entorno DB_PASSWORD
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/iparhotel?createDatabaseIfNotExist=true&serverTimezone=Europe/Madrid&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false
