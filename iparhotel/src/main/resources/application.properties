spring.application.name=iparhotel
server.port=8080

# ---------------------------------------------------------------
# Base de datos MySQL (se crea sola la primera vez)
# La contrasena se puede pasar con la variable de entorno DB_PASSWORD
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/iparhotel?createDatabaseIfNotExist=true&serverTimezone=Europe/Madrid&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# ---------------------------------------------------------------
# Fase 3: JWT
# El secreto NO esta escrito aqui: se lee de la variable de entorno JWT_SECRETO.
# Debe tener al menos 32 caracteres (256 bits) para firmar con HS256.
# Si la variable no existe, la aplicacion no arranca.
# ---------------------------------------------------------------
jwt.secreto=${JWT_SECRETO}
jwt.emisor=iparhotel
jwt.caducidad-minutos=60

# Origen de la aplicacion Angular (CORS)
cors.origen-permitido=http://localhost:4200
