# En las pruebas se usa H2 en memoria en lugar de MySQL
spring.datasource.url=jdbc:h2:mem:iparhotel;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Secreto fijo solo para las pruebas
jwt.secreto=secreto-de-pruebas-de-iparhotel-con-mas-de-32-caracteres
jwt.emisor=iparhotel
jwt.caducidad-minutos=60
cors.origen-permitido=http://localhost:4200
