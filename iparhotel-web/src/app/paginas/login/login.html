<section class="tarjeta">
  <h1>Iniciar sesión</h1>

  @if (error()) {
    <p class="aviso aviso-error" role="alert">{{ error() }}</p>
  }

  <form [formGroup]="formulario" (ngSubmit)="entrar()" novalidate>
    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" autocomplete="username" [class.invalido]="invalido('email')" />
    @if (invalido('email')) {
      <span class="error-campo">Introduce un email válido.</span>
    }

    <label for="password">Contraseña</label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password" [class.invalido]="invalido('password')" />
    @if (invalido('password')) {
      <span class="error-campo">Introduce tu contraseña.</span>
    }

    <button type="submit" class="boton" [disabled]="enviando()">{{ enviando() ? 'Entrando…' : 'Entrar' }}</button>
  </form>
</section>
